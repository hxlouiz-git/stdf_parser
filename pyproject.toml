[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stdf_parser"
version = "0.1.12"
description = "STDF (Standard Test Data Format) parser"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "flake8>=6.0",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/stdf_parser"
Repository = "https://github.com/yourusername/stdf_parser"

[tool.setuptools.packages.find]
include = ["stdf_parser*"]
