[build-system]
requires = ["setuptools>=61.0", "wheel", "cython>=3.0", "numpy>=1.21"]
build-backend = "setuptools.build_meta"

[project]
name = "stdf_parser"
version = "0.1.2"
description = "STDF (Standard Test Data Format) parser"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "flake8>=6.0",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/stdf_parser"
Repository = "https://github.com/yourusername/stdf_parser"

[tool.black]
line-length = 88
target-version = ['py38']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
